[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milk-quality-agent"
version = "0.1.0"
description = "Local Outlook-driven milk quality reporting agent."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
milk-quality-agent = "milk_quality_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

